<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent安全测试平台 - NESA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-shield-alt me-2"></i>
                NESA Agent安全测试平台
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card shadow">
                    <div class="card-header bg-light">
                        <h4 class="mb-0">
                            <i class="fas fa-robot me-2"></i>
                            LangChain Agent安全测试
                        </h4>
                        <p class="text-muted mb-0 mt-2">上传您的Agent文件，选择安全测试方法，获取详细的安全报告</p>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <!-- 文件上传区域 -->
                            <div class="mb-4">
                                <label for="agentFile" class="form-label">
                                    <i class="fas fa-file-code me-1"></i>
                                    Agent文件 (.py)
                                </label>
                                <div class="file-upload-area" id="fileUploadArea">
                                    <input type="file" class="form-control" id="agentFile" name="file" accept=".py" required>
                                    <div class="file-upload-help">
                                        <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i>
                                        <p class="text-muted">点击选择或拖拽Python文件到此处</p>
                                        <small class="text-muted">支持LangChain框架开发的Agent文件</small>
                                    </div>
                                </div>
                                <div class="file-info mt-2" id="fileInfo" style="display: none;">
                                    <i class="fas fa-file-alt text-success me-1"></i>
                                    <span id="fileName"></span>
                                    <span class="text-muted ms-2" id="fileSize"></span>
                                </div>
                            </div>

                            <!-- 测试方法选择 -->
                            <div class="mb-4">
                                <label class="form-label">
                                    <i class="fas fa-bug me-1"></i>
                                    选择安全测试方法
                                </label>
                                <div class="test-methods">
                                    <div class="form-check test-method-item">
                                        <input class="form-check-input" type="checkbox" value="prompt_injection" 
                                               id="promptInjection" name="test_methods" checked>
                                        <label class="form-check-label" for="promptInjection">
                                            <div class="test-method-info">
                                                <strong>提示词注入测试</strong>
                                                <small class="text-muted d-block">检测Agent是否易受提示词注入攻击</small>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="form-check test-method-item">
                                        <input class="form-check-input" type="checkbox" value="tool_response_injection" 
                                               id="toolResponseInjection" name="test_methods" checked>
                                        <label class="form-check-label" for="toolResponseInjection">
                                            <div class="test-method-info">
                                                <strong>工具返回注入测试</strong>
                                                <small class="text-muted d-block">检测工具返回值的安全性处理</small>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="form-check test-method-item">
                                        <input class="form-check-input" type="checkbox" value="sensitive_data_exposure" 
                                               id="sensitiveDataExposure" name="test_methods" checked>
                                        <label class="form-check-label" for="sensitiveDataExposure">
                                            <div class="test-method-info">
                                                <strong>敏感数据暴露检测</strong>
                                                <small class="text-muted d-block">检查API密钥、密码等敏感信息泄露</small>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="form-check test-method-item">
                                        <input class="form-check-input" type="checkbox" value="code_injection" 
                                               id="codeInjection" name="test_methods" checked>
                                        <label class="form-check-label" for="codeInjection">
                                            <div class="test-method-info">
                                                <strong>代码注入检测</strong>
                                                <small class="text-muted d-block">检测危险函数和代码注入风险</small>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="form-check test-method-item">
                                        <input class="form-check-input" type="checkbox" value="privilege_escalation" 
                                               id="privilegeEscalation" name="test_methods" checked>
                                        <label class="form-check-label" for="privilegeEscalation">
                                            <div class="test-method-info">
                                                <strong>权限升级检测</strong>
                                                <small class="text-muted d-block">检测可能的权限升级风险</small>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- 提交按钮 -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                    <i class="fas fa-play me-2"></i>
                                    开始安全测试
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 示例文件提示 -->
                <div class="alert alert-info mt-4" role="alert">
                    <h6 class="alert-heading">
                        <i class="fas fa-info-circle me-1"></i>
                        需要示例文件？
                    </h6>
                    <p class="mb-2">我们提供了两个示例Agent文件供您测试：</p>
                    <div class="d-flex gap-2 flex-wrap">
                        <a href="/static/examples/simple_agent.py" class="btn btn-outline-info btn-sm" download>
                            <i class="fas fa-download me-1"></i>
                            基础示例（需要配置API）
                        </a>
                        <a href="/static/examples/simple_agent_demo.py" class="btn btn-outline-success btn-sm" download>
                            <i class="fas fa-download me-1"></i>
                            演示版本（包含配置）
                        </a>
                    </div>
                    <small class="text-muted mt-2 d-block">
                        💡 推荐使用"演示版本"进行快速测试，包含了常见的安全漏洞
                    </small>
                </div>

                <!-- 测试进度 -->
                <div class="card mt-4" id="progressCard" style="display: none;">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-cog fa-spin me-2"></i>
                            正在进行安全测试...
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="progress mb-3">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 0%" id="progressBar"></div>
                        </div>
                        <div id="currentTest" class="text-muted">准备开始测试...</div>
                    </div>
                </div>

                <!-- 测试结果 -->
                <div class="card mt-4" id="resultsCard" style="display: none;">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-chart-bar me-2"></i>
                            测试结果
                        </h5>
                        <button class="btn btn-outline-primary btn-sm" id="downloadReportBtn">
                            <i class="fas fa-download me-1"></i>
                            下载详细报告
                        </button>
                    </div>
                    <div class="card-body" id="resultsContent">
                        <!-- 结果内容将通过JavaScript动态加载 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light mt-5 py-4">
        <div class="container text-center">
            <p class="text-muted mb-0">
                &copy; 2024 NESA Agent安全测试平台 | 
                <i class="fas fa-shield-alt text-primary"></i>
                专注于AI Agent安全防护
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
